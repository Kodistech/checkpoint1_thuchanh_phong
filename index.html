<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ByteForge · News, reviews and tutorials for tinkerers</title>
<meta name="description" content="A community for phones, gadgets and custom software: news, reviews, tutorials, rumors and forum discussions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem('bf_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body data-page="home">
<a class="skip" href="#main">Skip to content</a>
<header class="site-header" id="siteHeader"></header>

<main class="container" id="main">
  <div id="configBanner" class="banner" hidden>
    <strong>Supabase isn’t connected yet.</strong> Set <code>SUPABASE_URL</code> and
    <code>SUPABASE_ANON_KEY</code> at the top of <code>app.js</code>.
  </div>

  <section id="featured" aria-label="Featured posts" style="margin-top:18px" hidden></section>

  <div class="layout" style="margin-top:18px">
    <section aria-labelledby="feedTitle">
      <div class="section-head">
        <h2 id="feedTitle">Latest</h2>
        <nav class="chips" id="chips" aria-label="Filter by category"></nav>
      </div>
      <p class="filter-note" id="filterNote" hidden></p>
      <div class="post-list" id="postList" aria-live="polite"></div>
      <div class="load-more"><button class="btn btn-ghost" id="loadMore" type="button" hidden>Load more</button></div>
    </section>
    <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
  </div>
</main>

<footer class="site-footer" id="siteFooter"></footer>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
