<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title> Signup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="register.css">
</head>
<body>
<span class="deco a" aria-hidden="true">🎃</span>
<span class="deco b" aria-hidden="true">🎃</span>
<span class="deco c" aria-hidden="true">🦇</span>

<main class="wrap">
  <h1 class="title">🎃 Join the ok</h1>

  <div id="configBanner" class="banner" hidden>
    <strong>Supabase isn’t connected yet.</strong> Set <code>SUPABASE_URL</code> and
    <code>SUPABASE_ANON_KEY</code> at the top of <code>register.js</code>.
  </div>

  <section class="card" aria-labelledby="signupTitle">
    <h2 id="signupTitle">Signup</h2>
    <form id="signupForm" novalidate>
      <div class="field">
        <input type="email" id="signupEmail" placeholder="Email" aria-label="Email" autocomplete="email">
        <small class="err" id="signupEmailErr"></small>
      </div>
      <div class="field">
        <input type="password" id="signupPass" placeholder="Create password" aria-label="Create password" autocomplete="new-password">
        <button type="button" class="eye" data-eye="signupPass" aria-label="Show password">👁</button>
        <small class="err" id="signupPassErr"></small>
      </div>
      <div class="field">
        <input type="password" id="signupConfirm" placeholder="Confirm password" aria-label="Confirm password" autocomplete="new-password">
        <button type="button" class="eye" data-eye="signupConfirm" aria-label="Show password">👁</button>
        <small class="err" id="signupConfirmErr"></small>
      </div>
      <button type="submit" class="btn primary" id="signupBtn">Signup</button>
    </form>
    <div class="or">Or</div>
    <button type="button" class="btn google" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      Login with Google
    </button>
    <div class="msg" id="signupMsg" role="status" aria-live="polite"></div>
    <p class="switch">Already have an account? <a class="link" href="login.html">Login</a></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="register.js"></script>
</body>
</html>
